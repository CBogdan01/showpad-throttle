name: showpad-throttle
services:
  redis:
    image: redis:8.10.2-alpine@sha256:ba6e394f6acc2a695ef1b6944f161b9ca813711739be68319fa0db3470673f1d
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 15
    restart: unless-stopped
  api:
    profiles: ["app"]
    build: .
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      RATE_LIMIT_STORE: redis
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_NAMESPACE: compose
      CLIENTS_FILE: /app/config/clients.example.json
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
volumes:
  redis-data:
